name: Update GitHub Breakout Game

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install gh-brickbreak
        run: pip install git+https://github.com/dacebt/gh-brickbreak.git

      - name: Generate game
        run: |
          gh-brickbreak dacebt \
            --token ${{ secrets.GITHUB_TOKEN }} \
            --output public/images/github-breakout.gif \
            --strategy random \
            --fps 40

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/images/github-breakout.gif
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "Update GitHub breakout game [skip ci]" && git push)
