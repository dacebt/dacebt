name: Update GitHub Breakout Game

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: breakout-output
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install gh-brickbreak
        run: pip install git+https://github.com/dacebt/gh-brickbreak.git

      - name: Generate game
        run: |
          gh-brickbreak dacebt \
            --token ${{ secrets.GITHUB_TOKEN }} \
            --output github-breakout.gif \
            --strategy follow \
            --fps 40

      - name: Push to output branch (keeps main clean)
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add github-breakout.gif
          git diff --staged --quiet && exit 0
          git commit -m "Update breakout game [skip ci]"
          git push --force origin HEAD:breakout-output
